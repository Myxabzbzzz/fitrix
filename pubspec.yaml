name: fitrix
description: AI-powered fitness application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.2

  # Local Storage
  shared_preferences: ^2.2.3

  # HTTP Client (streams Felix's replies)
  dio: ^5.4.3+1

  # UUID
  uuid: ^4.3.3

  # UI Components
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
