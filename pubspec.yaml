name: fitrix
description: AI-powered fitness application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.2

  # Local Storage
  shared_preferences: ^2.2.3

  # HTTP Client (streams Felix's replies)
  dio: ^5.4.3+1

  # UUID
  uuid: ^4.3.3

  # UI Components
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.20.2
  supabase_flutter: ^2.18.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
