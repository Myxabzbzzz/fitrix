name: fitrix
description: AI-powered fitness application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.2

  # Local Storage
  shared_preferences: ^2.2.3

  # HTTP Client
  http: ^1.2.1
  dio: ^5.4.3+1

  # JSON Serialization
  json_annotation: ^4.8.1

  # UUID
  uuid: ^4.3.3

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
